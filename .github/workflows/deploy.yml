name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches: [main]

env:
  PNPM_VERSION: 8.15.0
  NODE_VERSION: 20

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: https://staging.dingo.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig

      - name: Deploy API to Staging
        run: |
          helm upgrade --install dingo-api ./charts/dingo-api \
            --namespace staging \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set env[0].value="staging" \
            --wait

      - name: Deploy Web to Staging
        run: |
          helm upgrade --install dingo-web ./charts/dingo-web \
            --namespace staging \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set env[0].value="staging" \
            --wait

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment:
      name: production
      url: https://dingo.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubernetes
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=./kubeconfig

      - name: Deploy API to Production
        run: |
          helm upgrade --install dingo-api ./charts/dingo-api \
            --namespace production \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set env[0].value="production" \
            --wait

      - name: Deploy Web to Production
        run: |
          helm upgrade --install dingo-web ./charts/dingo-web \
            --namespace production \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set env[0].value="production" \
            --wait

      - name: Notify deployment
        if: success()
        run: |
          echo "🚀 Successfully deployed to production!"
          echo "API: https://api.dingo.com"
          echo "Web: https://dingo.com"
