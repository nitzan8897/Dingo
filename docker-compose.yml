services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dingo
      POSTGRES_PASSWORD: dingo123
      POSTGRES_DB: dingo
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dingo']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dingo-network

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dingo-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dingo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - dingo-network

  # NestJS API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: dingo-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dingo:dingo123@postgres:5432/dingo?schema=public
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dingo-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Next.js Web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: dingo-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/v1
      API_URL: http://api:3001/v1
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - api
    networks:
      - dingo-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  dingo-network:
    driver: bridge
